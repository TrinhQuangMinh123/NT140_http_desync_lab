services:
  proxy:
    build: proxy/
    volumes:
      - ./ats_records.config:/etc/trafficserver/records.config:ro
      - ./ats_remap.config:/etc/trafficserver/remap.config:ro
    ports:
      - "8889:8889"
    depends_on:
      - backend

  backend:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./backend:/app
    command: sh -c "pip install gevent -q && python3 -c 'import gevent.monkey; gevent.monkey.patch_all(); from gevent.pywsgi import WSGIServer; from app import application; print(\"Backend (Gevent) listening on 0.0.0.0:9002\"); WSGIServer((\"0.0.0.0\", 9002), application).serve_forever()'"
    ports:
      - "9002:9002"
