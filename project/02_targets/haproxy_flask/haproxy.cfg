global
    daemon
    maxconn 256

defaults
    mode http
    timeout connect 5s
    timeout client  10s
    timeout server  10s
    # CRITICAL: Do NOT normalize headers — preserve TE and CL as-is
    option http-server-close
    no option forwardfor

frontend http_in
    bind *:8890
    default_backend gunicorn

backend gunicorn
    server backend1 backend:9003 check
