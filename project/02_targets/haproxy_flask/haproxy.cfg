global
    daemon
    maxconn 256

defaults
    mode http
    timeout connect 5s
    timeout client  10s
    timeout server  10s
    # CRITICAL: Preserve TE and CL as-is for fuzzing
    option http-server-close
    # Allow non-standard characters in headers to surface desync
    option accept-invalid-http-request
    option accept-invalid-http-response

frontend http_in
    bind *:8890
    # Response-side harness (paper §4.3.2 mode 2): route /resp-test/ to the
    # fuzzer-controlled fake_upstream on host port 9501.
    acl is_resp_test path_beg /resp-test/
    use_backend fake_upstream if is_resp_test
    default_backend gunicorn

backend gunicorn
    server backend1 backend:9003 check

backend fake_upstream
    server fu1 host.docker.internal:9501
