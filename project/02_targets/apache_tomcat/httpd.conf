ServerRoot "/usr/local/apache2"
Listen 8891

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule unixd_module modules/mod_unixd.so

User daemon
Group daemon

# Disable Content-Length normalization — preserve TE/CL as-is
HttpProtocolOptions Unsafe

ProxyPreserveHost On

# Response-side harness (paper §4.3.2 mode 2). MUST be declared BEFORE
# the catch-all `ProxyPass /` below so the longer prefix wins.
ProxyPass        /resp-test/ http://host.docker.internal:9501/
ProxyPassReverse /resp-test/ http://host.docker.internal:9501/

# Forward everything else to Tomcat backend
ProxyPass        / http://backend:8080/
ProxyPassReverse / http://backend:8080/

ErrorLog /proc/self/fd/2
LogLevel warn
