# Variant of nginx.conf that routes proxy_pass through the host-side
# wire_tap.py relay (host.docker.internal:9100). Used only for forensic
# wire-level analysis — DO NOT use during normal differential fuzzing
# because the extra hop adds latency.

user  nginx;
worker_processes  1;
error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events { worker_connections  64; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format desync_fmt '$remote_addr [$time_local] '
                          '"$request" $status $body_bytes_sent '
                          'req_te="$http_transfer_encoding" '
                          'req_cl="$http_content_length"';
    access_log  /var/log/nginx/access.log desync_fmt;

    sendfile         off;
    tcp_nopush       off;
    tcp_nodelay      on;

    keepalive_timeout    65;
    client_body_timeout  30;
    send_timeout         30;

    server {
        listen       80;
        server_name  localhost;

        location / {
            # Route through wire_tap (host:9100) → real backend (host:9001)
            proxy_pass         http://host.docker.internal:9100;
            proxy_http_version 1.1;

            proxy_set_header   Connection        $http_connection;
            proxy_set_header   Transfer-Encoding $http_transfer_encoding;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;

            proxy_request_buffering  off;
            proxy_buffering          off;
        }

        location /resp-test/ {
            proxy_pass         http://host.docker.internal:9501/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   Connection        $http_connection;
            proxy_request_buffering  off;
            proxy_buffering          off;
            proxy_read_timeout 5s;
        }
    }
}
