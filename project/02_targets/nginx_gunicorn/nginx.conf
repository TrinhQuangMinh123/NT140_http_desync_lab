# ─────────────────────────────────────────────────────────────────────────────
# Nginx Reverse Proxy Configuration
# Target Pair: Nginx (Proxy) → Gunicorn/Python-WSGI (Backend)
#
# Key desync-relevant settings (mirrors HDHunter's Apache config):
#   - proxy_request_buffering off : Pass raw bytes through without normalisation
#   - keepalive_requests 1000     : Enable pipelining across the proxy
#   - proxy_http_version 1.1      : Use HTTP/1.1 to backend (TE header survives)
#   - Logging: full request/response headers for differential analysis
# ─────────────────────────────────────────────────────────────────────────────

user  nginx;
# Single worker process (mirrors HDHunter's -X single-thread Apache flag)
worker_processes  1;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    # Max concurrent connections (keep low for deterministic fuzzing)
    worker_connections  64;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Verbose log format: records TE and CL headers for forensic diffing
    log_format desync_fmt '$remote_addr [$time_local] '
                          '"$request" $status $body_bytes_sent '
                          'req_te="$http_transfer_encoding" '
                          'req_cl="$http_content_length"';

    access_log  /var/log/nginx/access.log desync_fmt;

    sendfile         off;   # off → safer for raw byte analysis
    tcp_nopush       off;
    tcp_nodelay      on;

    # Do NOT timeout quickly — give malformed requests time to arrive
    keepalive_timeout    65;
    client_body_timeout  30;
    send_timeout         30;

    server {
        listen       80;
        server_name  localhost;

        location / {
            # ── Core Proxy Settings ──────────────────────────────────────────
            proxy_pass         http://backend:9001;
            proxy_http_version 1.1;

            # Preserve the original Connection and TE headers (critical for Desync)
            proxy_set_header   Connection        $http_connection;
            proxy_set_header   Transfer-Encoding $http_transfer_encoding;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;

            # Disable request/response buffering so raw bytes flow through
            proxy_request_buffering  off;
            proxy_buffering          off;

            # Allow HTTP upgrades and keep pipelining alive
            proxy_set_header   Upgrade           $http_upgrade;
        }

        # ── Response-side Harness Route (paper §4.3.2 mode 2) ─────────────────
        # /resp-test/ is proxied to a fuzzer-controlled fake upstream that
        # returns malformed HTTP responses. The proxy's response parser is
        # the actual target here.
        location /resp-test/ {
            proxy_pass         http://host.docker.internal:9501/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   Connection        $http_connection;
            proxy_request_buffering  off;
            proxy_buffering          off;
            # Short read timeout so the fuzzer can iterate quickly when the
            # upstream stalls.
            proxy_read_timeout 5s;
        }
    }
}
